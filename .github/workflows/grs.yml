name: Update README card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: mkdir -p .cards-tmp profile

      # 卡片先生成到 .cards-tmp/，校验通过才覆盖 profile/ 下的正式文件，
      # 生成失败时保留上一次的好文件，不会把报错图提交进仓库。
      #
      # stats 卡需要跨仓库/用户级聚合数据（总 commit、PR、issue、star），
      # GITHUB_TOKEN 只作用于本仓库，会返回 "Resource not accessible by integration"，
      # 因此走仓库 Secret GH_PAT（classic PAT，勾 read:user）。
      - name: Generate stats card
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent&hide_title=true
          path: .cards-tmp/stats.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Validate and publish
        id: validate
        run: |
          src=.cards-tmp/stats.svg
          if [ ! -s "$src" ]; then
            echo "::warning::stats 生成失败（文件缺失或为空），保留原有文件"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          elif grep -qi "Something went wrong\|Resource not accessible\|Bad credentials\|rate limit" "$src"; then
            reason=$(grep -oiE "Resource not accessible[^<]*|Bad credentials[^<]*|rate limit[^<]*|Something went wrong[^<]*" "$src" | head -1)
            echo "::warning::stats 生成失败（$reason），保留原有文件"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$src" profile/stats.svg
            echo "stats 校验通过"
          fi
          rm -rf .cards-tmp

      - name: Commit card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update README card"
          file_pattern: "profile/*.svg"

      - name: Report failure
        if: steps.validate.outputs.failed == 'true'
        run: |
          echo "stats 卡本次未能更新，通常是 GH_PAT 缺失或过期（需 read:user）"
          exit 1
